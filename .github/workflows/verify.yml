name: Verify storefront
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm install --no-save playwright axe-core
      - run: npx playwright install --with-deps chromium
      - name: Browser QA
        env:
          QA_BROWSER_CHANNEL: chromium
        run: |
          npm run start > /tmp/big-mos-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000 > /dev/null && break || sleep 1; done
          node scripts/browser-qa.cjs
          node scripts/accessibility-qa.cjs
